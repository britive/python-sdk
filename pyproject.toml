[build-system]
requires = [
    "setuptools>=84.1.0",
    "wheel>=0.46.2"
]
build-backend = "setuptools.build_meta"

[project]
name = "britive"
authors = [{name = "Britive Inc.", email = "support@britive.com"}]
description = "A pure Python SDK for the Britive API"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet",
    "Topic :: Security",
]
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.0",
    "jmespath>=1.1.0",
    "urllib3>=2.8.0"
]
dynamic = ["version"]
keywords = ["britive", "cpam", "identity", "jit"]

[project.optional-dependencies]
aws = ["boto3>=1.41.0"]
azure = ["azure-identity>=1.16.1"]
gcp = ["google-auth>=2.16.1"]

[project.urls]
Homepage = "https://www.britive.com"
Documentation = "https://docs.britive.com/v1/docs/en/overview-britive-apis"
Repository = "https://github.com/britive/python-sdk.git"
Issues = "https://github.com/britive/python-sdk/issues"
Changelog = "https://github.com/britive/python-sdk/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "britive.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.tox]
legacy_tox_ini = """
[tox]
requires =
    tox>=4.58.0
    virtualenv>=21.14.13
envlist = py311,py312,py313,py314,py315
isolated_build = True

[testenv]
# install dependencies virtualenv where commands will be executed
deps =
    -rrequirements.txt
    pytest>=9.1.0
    pyotp
commands =
    # NOTE: you can run any command line tool here - not just tests
    python -m pytest -v {posargs}
passenv = BRITIVE_TENANT,BRITIVE_API_TOKEN,BRITIVE_TEST_ENV_ACCOUNT_ID,BRITIVE_TEST_IGNORE_SCAN,BRITIVE_GCP_TEST_APP_ID
"""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "[0-9]*.py"]

[tool.pymarkdown]
plugins.md013.line_length = 120
plugins.md013.code_block_line_length = 120

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/*.py"]
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "I", # isort
    "PL", #pylint
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F403", "F405"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]
max-args = 14
max-branches = 30
max-returns = 8
max-statements = 72
